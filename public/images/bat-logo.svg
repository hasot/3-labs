<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Bat symbol / Batman logo -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main bat body -->
  <g fill="rgba(255, 255, 200, 0.8)" filter="url(#glow)">
    <!-- Center body -->
    <circle cx="100" cy="100" r="12" fill="rgba(255, 255, 200, 1)"/>

    <!-- Left wing -->
    <path d="M 100 100 Q 60 80 50 120 Q 45 140 55 150 Q 70 155 80 140 Q 85 130 90 110 Z" />

    <!-- Right wing -->
    <path d="M 100 100 Q 140 80 150 120 Q 155 140 145 150 Q 130 155 120 140 Q 115 130 110 110 Z" />

    <!-- Left ear -->
    <path d="M 70 75 Q 65 50 70 35 Q 75 40 75 60 Z" />

    <!-- Right ear -->
    <path d="M 130 75 Q 135 50 130 35 Q 125 40 125 60 Z" />

    <!-- Horns detail -->
    <path d="M 68 60 L 65 40" stroke="rgba(255, 255, 200, 0.8)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 132 60 L 135 40" stroke="rgba(255, 255, 200, 0.8)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>